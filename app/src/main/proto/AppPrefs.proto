syntax = "proto3";

option java_package = "org.tfv.deskflow.data.models";
option java_multiple_files = true;

message AppPrefs {
  message LoggingConfig {
    bool forwarding_enabled = 1;
    string forwarding_level = 2; // e.g., "DEBUG", "INFO", "WARN", "ERROR"
  }

  message ScreenConfig {
    message ServerConfig {
      string address = 1;

      int32 port = 2;

      bool use_tls = 3;

      // When `false` (default), the app automatically searches the local
      // network for a Deskflow server & connects to it.
      bool auto_discover_disabled = 4;
    }

    string name = 1;

    ServerConfig server = 5;

  }

  message ActionsConfig {
    message Shortcut {
      string action_id = 1;

      string label = 2;
      string description = 3;

      uint32 key_code = 5;
      uint32 key_mask = 6;

    }
    map<string, Shortcut> shortcuts = 5;
  }



  message InputConfig {
    // Invert the vertical mouse wheel / trackpad scroll direction
    bool scroll_invert = 1;

    // Scroll speed in percent, `0` means default (100%)
    int32 scroll_speed_percent = 2;

    // Invert the horizontal scroll direction
    bool scroll_invert_x = 3;
  }

  ScreenConfig screen = 1;

  ActionsConfig actions = 2;

  LoggingConfig logging = 3;

  InputConfig input = 4;

  // Set once the connection was configured by the user, automatic server
  // discovery only runs afterwards (not on the very first app start).
  bool setup_completed = 5;

}